name: Size

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: size-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: 'pnpm' }
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

      - name: Check per-chunk JS size budget (gzip)
        id: size
        shell: bash
        run: |
          set -euo pipefail
          # Budget: each individual JS chunk under dist/client/_astro/*.js must
          # gzip to <= 6 KB. We deliberately budget per-chunk rather than
          # total-bytes, since route-specific chunks load on demand and the
          # per-route initial JS is what matters for TTI.
          BUDGET_BYTES=$((6 * 1024))
          DIR=dist/client/_astro
          if [ ! -d "$DIR" ]; then
            echo "No $DIR — skipping (different output layout?)"
            exit 0
          fi
          fail=0
          rows=""
          while IFS= read -r -d '' f; do
            raw=$(wc -c <"$f" | tr -d ' ')
            gz=$(gzip -c "$f" | wc -c | tr -d ' ')
            base=$(basename "$f")
            status="ok"
            if [ "$gz" -gt "$BUDGET_BYTES" ]; then
              status="OVER"
              fail=1
            fi
            rows+=$(printf "| \`%s\` | %d B | %d B | %s |\n" "$base" "$raw" "$gz" "$status")
            rows+=$'\n'
          done < <(find "$DIR" -maxdepth 1 -type f -name '*.js' -print0)

          {
            echo "## JS bundle size (gzip, budget 6 KB / chunk)"
            echo
            echo "| chunk | raw | gzip | status |"
            echo "| --- | ---: | ---: | --- |"
            printf "%s" "$rows"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more JS chunks exceed the 6 KB gzip budget"
            exit 1
          fi

      - name: Comment size report on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = await import('node:fs/promises');
            const summary = await fs.readFile(process.env.GITHUB_STEP_SUMMARY, 'utf8');
            const marker = '<!-- size-bot -->';
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
